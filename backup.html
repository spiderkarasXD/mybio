<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101418" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <title>spiderkaras</title>

  <script>
    // A fresh, practically non-repeatable pastel aurora on every page load.
    (function () {
      const root = document.documentElement;
      const randomValues = new Uint32Array(40);
      crypto.getRandomValues(randomValues);
      let cursor = 0;
      const random = (min, max) => min + (randomValues[cursor++ % randomValues.length] / 4294967295) * (max - min);

      function blob(alpha) {
        const width = random(28, 48).toFixed(2);
        const height = random(30, 50).toFixed(2);
        const x = random(5, 95).toFixed(2);
        const y = random(5, 95).toFixed(2);
        const hue = random(0, 360).toFixed(2);
        const saturation = random(62, 84).toFixed(2);
        const lightness = random(72, 86).toFixed(2);
        return `radial-gradient(${width}% ${height}% at ${x}% ${y}%, hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha}), transparent 64%)`;
      }

      root.style.setProperty("--aurora-layer-one", [
        blob(.52), blob(.48), blob(.42), blob(.36), blob(.34)
      ].join(","));
      root.style.setProperty("--aurora-layer-two", [
        blob(.32), blob(.34), blob(.30)
      ].join(","));
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

    /* ---- Material 3 dark color roles ---- */
    :root {
      color-scheme: dark;

      --primary: #a8c7fa;
      --on-primary: #062e6f;
      --primary-container: #284777;
      --on-primary-container: #d3e3fd;

      --secondary: #bfc6dc;
      --secondary-container: #3c4358;
      --on-secondary-container: #dbe1f9;

      --tertiary: #d6bee4;
      --tertiary-container: #523f61;
      --on-tertiary-container: #f2daff;

      --surface: #101418;
      --surface-dim: #101418;
      --surface-bright: #36393e;
      --surface-container-lowest: #0b0e12;
      --surface-container-low: #181c20;
      --surface-container: #1c2024;
      --surface-container-high: #272a2f;
      --surface-container-highest: #32353a;

      --on-surface: #e1e2e8;
      --on-surface-variant: #c3c6cf;
      --outline: #8d9199;
      --outline-variant: #43474e;

      /* M3 shape scale */
      --shape-xs: 8px;
      --shape-sm: 12px;
      --shape-md: 16px;
      --shape-lg: 20px;
      --shape-xl: 28px;
      --shape-full: 999px;

      --easing: cubic-bezier(.2, 0, 0, 1);
      --max: 480px;
      --font-display: "Fredoka", "Trebuchet MS", sans-serif;
      --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100svh;
      margin: 0;
      font-family: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      overflow-x: hidden;
      text-rendering: optimizeLegibility;
    }

    /* ---- Codex-style flowing aurora background ---- */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(ellipse at center, #0f1216 0%, #08090b 70%, #050506 100%);
    }
    .aurora::before,
    .aurora::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: var(--aurora-layer-one);
      filter: blur(60px) saturate(120%);
      animation: aurora-drift 24s ease-in-out infinite alternate;
      will-change: transform;
    }
    .aurora::after {
      background: var(--aurora-layer-two);
      animation: aurora-drift-2 30s ease-in-out infinite alternate;
      mix-blend-mode: screen;
      opacity: .9;
    }
    .aurora .grain {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: .5;
      mix-blend-mode: overlay;
    }
    .aurora .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    #ripples {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      width: 100vw;
      height: 100vh;
    }
    @keyframes aurora-drift {
      0%   { transform: translate3d(-4%, -3%, 0) rotate(0deg)   scale(1.05); }
      50%  { transform: translate3d( 3%,  2%, 0) rotate(6deg)   scale(1.15); }
      100% { transform: translate3d( 5%, -4%, 0) rotate(-4deg)  scale(1.08); }
    }
    @keyframes aurora-drift-2 {
      0%   { transform: translate3d( 4%,  3%, 0) rotate(0deg)   scale(1.10); }
      50%  { transform: translate3d(-5%, -2%, 0) rotate(-8deg)  scale(1.20); }
      100% { transform: translate3d(-3%,  5%, 0) rotate(5deg)   scale(1.12); }
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

    /* ---- mobile-first shell ---- */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      display: grid;
      gap: 14px;
    }

    /* M3 cards = surface container, extra-large shape */
    .card {
      position: relative;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .045), transparent 45%),
        rgba(24, 28, 33, 0.69);
      backdrop-filter: blur(20px) saturate(125%);
      -webkit-backdrop-filter: blur(20px) saturate(125%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--shape-xl);
      overflow: hidden;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, .2),
        inset 0 1px 0 rgba(255, 255, 255, .035);
      transition:
        transform .3s var(--easing),
        border-color .3s var(--easing),
        box-shadow .3s var(--easing);
    }

    /* ---- top app bar ---- */
    .appbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 4px;
    }
    .appbar .title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.025em;
    }
    .appbar .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 12px 0 10px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--shape-full);
      background: rgba(60, 67, 88, .72);
      color: var(--on-secondary-container);
      font-size: 12px;
      font-weight: 600;
      max-width: 60%;
      backdrop-filter: blur(12px);
    }
    .status .dot {
      width: 8px; height: 8px; flex: 0 0 auto;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(168, 199, 250, .11), 0 0 12px var(--primary);
      transition: background .25s var(--easing), box-shadow .25s var(--easing);
    }
    .status[data-status="online"] .dot { background: #43b581; box-shadow: 0 0 0 4px rgba(67, 181, 129, .12), 0 0 12px #43b581; }
    .status[data-status="idle"] .dot { background: #faa61a; box-shadow: 0 0 0 4px rgba(250, 166, 26, .12), 0 0 12px #faa61a; }
    .status[data-status="dnd"] .dot { background: #f04747; box-shadow: 0 0 0 4px rgba(240, 71, 71, .12), 0 0 12px #f04747; }
    .status[data-status="offline"] .dot { background: #747f8d; box-shadow: 0 0 0 4px rgba(116, 127, 141, .12), 0 0 8px #747f8d; }
    .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---- hero / profile ---- */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding: 32px 20px 26px;
      background:
        radial-gradient(120% 90% at 50% -10%, rgba(168, 199, 250, .20), transparent 62%),
        linear-gradient(145deg, rgba(255, 255, 255, .06), transparent 48%),
        rgba(24, 28, 33, .62);
    }
    .avatar {
      width: 108px; height: 108px;
      border-radius: var(--shape-full);
      padding: 3px;
      background: linear-gradient(135deg, var(--primary), var(--tertiary));
      box-shadow:
        0 12px 34px rgba(0, 0, 0, .35),
        0 0 34px rgba(168, 199, 250, .15);
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: var(--shape-full);
      background: var(--surface-container-high);
      display: block;
    }
    .name-row { display: inline-flex; align-items: center; gap: 6px; }
    .profile h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 600;
      letter-spacing: -.035em;
    }

    /* M3 icon button (filled tonal) */
    .icon-btn {
      width: 40px; height: 40px;
      flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: var(--shape-full);
      background: var(--surface-container-highest);
      color: var(--on-surface-variant);
      border: 1px solid rgba(255, 255, 255, .06);
      transition: background .2s var(--easing), color .2s var(--easing), transform .2s var(--easing);
    }
    .icon-btn:hover { background: var(--primary-container); color: var(--on-primary-container); transform: rotate(18deg) scale(1.05); }
    .icon-btn:active { transform: rotate(18deg) scale(.95); }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* ---- now playing ---- */
    .np { padding: 16px; }
    .np-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
      color: var(--on-surface-variant);
      font-size: 13px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .np-head .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
    .np-head .eq i { width: 3px; background: var(--primary); border-radius: 2px; animation: eq 1s var(--easing) infinite; }
    .np-head .eq i:nth-child(1){ height: 6px; animation-delay: -.2s; }
    .np-head .eq i:nth-child(2){ height: 12px; animation-delay: -.5s; }
    .np-head .eq i:nth-child(3){ height: 8px; animation-delay: 0s; }
    @keyframes eq { 0%,100%{ transform: scaleY(.4);} 50%{ transform: scaleY(1);} }

    .track { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 14px; align-items: center; }
    .cover {
      width: 64px; height: 64px;
      border-radius: var(--shape-sm);
      overflow: hidden;
      background: var(--surface-container-high);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .track h2 { margin: 0; font-family: var(--font-body); font-size: 16px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track p { margin: 4px 0 0; color: var(--on-surface-variant); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 14px; color: var(--on-surface-variant); font-size: 12px; font-variant-numeric: tabular-nums; }
    .bar { height: 4px; border-radius: var(--shape-full); background: var(--surface-container-highest); overflow: hidden; }
    .bar i { display: block; width: 0%; height: 100%; background: var(--primary); border-radius: inherit; transition: width .6s linear; }

    /* ---- socials grid ---- */
    .socials {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .social {
      display: flex; align-items: center; gap: 12px;
      min-height: 64px;
      padding: 12px 14px;
      border-radius: var(--shape-md);
      border: 1px solid rgba(255, 255, 255, .045);
      background: rgba(39, 42, 47, 0.58);
      transition: background .2s var(--easing), transform .2s var(--easing), border-color .2s var(--easing);
    }
    .social:active { transform: scale(.97); }
    .social:hover { background: rgba(55, 59, 65, .78); border-color: rgba(255, 255, 255, .10); transform: translateY(-2px); }
    .social i {
      width: 40px; height: 40px; flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: var(--shape-full);
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .social i svg { width: 20px; height: 20px; fill: currentColor; }
    .social strong { font-family: var(--font-display); font-size: 15px; font-weight: 500; letter-spacing: -.01em; }

    /* ---- comments ---- */
    .comments { padding: 16px; background: rgba(21, 32, 43, 0.70) !important; }
    .comments h2 { margin: 0 0 14px; font-family: var(--font-body); font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
    .comments-mount { min-height: 120px; background: rgba(21, 32, 43, 0.50); border-radius: var(--shape-md); }
    .comments-mount iframe { background: transparent !important; }
    .comments-fallback { margin: 0; color: var(--on-surface-variant); font-size: 13px; }

    /* ---- footer ---- */
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 6px;
      color: var(--on-surface-variant);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .footer .smooth-text { font-family: var(--font-display); font-size: 13px; font-weight: 500; }

    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, .13);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, .26),
          inset 0 1px 0 rgba(255, 255, 255, .05);
      }
      .profile:hover { transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .social, .icon-btn { transition: none; }
    }

    /* text swap animation */
    .smooth-text { display: inline-block; transition: opacity .25s var(--easing), transform .25s var(--easing); }
    .smooth-text.is-changing { opacity: 0; transform: translateY(4px); }

    /* ---- scale up on larger screens (mobile-first) ---- */
    @media (min-width: 600px) {
      :root { --max: 520px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>

  <script>
    const PROFILE = {
      nicknames: ["spiderkarasXD", "spidorkaras", "spiderkaras"],
      discordId: "1407136994764525749",

      socials: {
        steam: "https://steamcommunity.com/id/spiderkarasXD/",
        discord: "https://discord.com/users/1407136994764525749",
        spotify: "https://open.spotify.com/",
        tiktok: "https://www.tiktok.com/@spiderkaras_",
        telegram: "https://t.me/badtexting"
      }
    };

    const $ = (s) => document.querySelector(s);
    const state = { nick: 2, start: 0, end: 0, timer: 0, ws: null, heartbeat: 0 };

    function safeHref(url) { return url && url !== "#" ? url : "#"; }

    function swapText(target, value, instant = false) {
      if (!target || target.textContent === value) return;
      if (instant) { target.textContent = value; return; }
      target.classList.add("is-changing");
      window.setTimeout(() => {
        target.textContent = value;
        target.classList.remove("is-changing");
      }, 180);
    }

    function setNick(index, instant = false) {
      state.nick = (index + PROFILE.nicknames.length) % PROFILE.nicknames.length;
      const nick = PROFILE.nicknames[state.nick];
      swapText($("#nickname"), nick, instant);
      swapText($("#brandNick"), nick, instant);
      swapText($("#footerNick"), nick, instant);
      document.title = nick;
    }

    function nextNick() { setNick(state.nick + 1); }

    function defaultDiscordAvatar(user = {}) {
      const id = user.id || PROFILE.discordId;
      const discriminator = user.discriminator || "0";
      const index = discriminator === "0"
        ? Number((BigInt(id) >> 22n) % 6n)
        : Number(discriminator) % 5;
      return `https://cdn.discordapp.com/embed/avatars/${index}.png`;
    }

    function discordAvatarUrl(user = {}) {
      if (!user.avatar) return defaultDiscordAvatar(user);
      const extension = user.avatar.startsWith("a_") ? "gif" : "webp";
      return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=256`;
    }

    function setDiscordStatus(status = "offline") {
      const statuses = {
        online: "в сети",
        idle: "неактивен",
        dnd: "не беспокоить",
        offline: "не в сети"
      };
      const normalized = statuses[status] ? status : "offline";
      $("#presence").dataset.status = normalized;
      $("#presenceText").textContent = statuses[normalized];
    }

    function renderProfile() {
      const avatar = $("#avatar");
      avatar.src = defaultDiscordAvatar();
      avatar.onerror = () => { avatar.onerror = null; avatar.src = defaultDiscordAvatar(); };
      document.querySelectorAll("[data-social]").forEach((a) => a.href = safeHref(PROFILE.socials[a.dataset.social]));
      setNick(state.nick, true);
    }

    function fmt(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    }

    function stopProgress() { if (state.timer) clearInterval(state.timer); state.timer = 0; }

    function updateProgress() {
      const total = Math.max(1, state.end - state.start);
      const elapsed = Math.min(Math.max(0, Date.now() - state.start), total);
      $("#elapsed").textContent = fmt(elapsed);
      $("#duration").textContent = fmt(total);
      $("#bar").style.width = `${Math.round((elapsed / total) * 100)}%`;
      if (elapsed >= total) stopProgress();
    }

    function setIdle(title = "ничего не играет") {
      stopProgress();
      $("#trackTitle").textContent = title;
      $("#trackArtist").textContent = "—";
      $("#trackLink").href = PROFILE.socials.spotify;
      $("#elapsed").textContent = "0:00";
      $("#duration").textContent = "0:00";
      $("#bar").style.width = "0%";
      $("#cover").hidden = true;
    }

    // Render a Lanyard presence object (same shape from REST and WebSocket).
    function applyPresence(data) {
      const sp = data?.spotify;
      const user = data?.discord_user;

      setDiscordStatus(data?.discord_status);

      if (user) {
        $("#avatar").src = discordAvatarUrl(user);
      }

      if (!sp) return setIdle("не слушаю Spotify");

      stopProgress();
      $("#trackTitle").textContent = sp.song || "Unknown track";
      $("#trackArtist").textContent = `${sp.artist || "Unknown artist"} · ${sp.album || ""}`;
      $("#trackLink").href = sp.track_id ? `https://open.spotify.com/track/${sp.track_id}` : PROFILE.socials.spotify;

      if (sp.album_art_url) { $("#cover").src = sp.album_art_url; $("#cover").hidden = false; }

      state.start = sp.timestamps?.start || Date.now();
      state.end = sp.timestamps?.end || Date.now();
      updateProgress();
      state.timer = setInterval(updateProgress, 1000);
    }

    // Real-time presence via Lanyard WebSocket (same mechanism Discord uses),
    // so updates are instant instead of polling every N seconds.
    function connectLanyard() {
      const id = PROFILE.discordId.trim();
      if (!/^[0-9]{17,22}$/.test(id)) {
        setDiscordStatus("offline");
        return setIdle("нужен Discord ID");
      }

      let ws;
      try { ws = new WebSocket("wss://api.lanyard.rest/socket"); }
      catch { return setIdle("RPC недоступен"); }
      state.ws = ws;

      ws.addEventListener("message", (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }

        if (msg.op === 1) {
          // Hello: start heartbeat and subscribe to this Discord user.
          clearInterval(state.heartbeat);
          state.heartbeat = setInterval(() => {
            if (ws.readyState === 1) ws.send(JSON.stringify({ op: 3 }));
          }, msg.d.heartbeat_interval);
          ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: id } }));
        } else if (msg.op === 0) {
          // INIT_STATE / PRESENCE_UPDATE — d is the presence object.
          const data = msg.d && msg.d.discord_user ? msg.d : (msg.d?.[id] || msg.d);
          applyPresence(data);
        }
      });

      ws.addEventListener("close", () => {
        clearInterval(state.heartbeat);
        setDiscordStatus("offline");
        setTimeout(connectLanyard, 3000); // auto-reconnect like a Discord client
      });
      ws.addEventListener("error", () => { try { ws.close(); } catch {} });
    }

    function loadComments() {
      const mount = $("#commentsMount");
      mount.textContent = "";
      const script = document.createElement("script");
      script.async = true;
      script.src = "https://comments.app/js/widget.js?3";
      script.dataset.commentsAppWebsite = "PlNVWl0S";
      script.dataset.limit = "5";
      script.dataset.dislikes = "1";
      script.dataset.outlined = "1";
      script.dataset.colorful = "1";
      script.dataset.dark = "1";
      mount.appendChild(script);
    }

    function tickClock() {
      $("#localTime").textContent = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    }

    renderProfile();
    tickClock();

    $("#nickButton").addEventListener("click", nextNick);

    setInterval(nextNick, 3200);
    setInterval(tickClock, 15000);
    connectLanyard();

    if ("requestIdleCallback" in window) requestIdleCallback(loadComments, { timeout: 2500 });
    else setTimeout(loadComments, 1400);
  </script>

  <!-- Legacy particle cursor effect (superseded below) -->
  <script>
    (function () {
      return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const canvas = document.getElementById('ripples');
      const ctx = canvas.getContext('2d');
      const DPR = Math.min(window.devicePixelRatio || 1, 2);

      let W = 0, H = 0;
      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      const particles = [];
      const MAX = 260;
      let mouseX = -999, mouseY = -999;
      let lastX = -999, lastY = -999;

      function spawn(x, y, vx, vy) {
        // small radius particles: 0.6–1.8px
        const size = 0.6 + Math.random() * 1.2;
        const jitter = 3;
        const angle = Math.random() * Math.PI * 2;
        const spread = 0.25 + Math.random() * 0.6;
        particles.push({
          x: x + (Math.random() - 0.5) * jitter,
          y: y + (Math.random() - 0.5) * jitter,
          vx: vx * 0.15 + Math.cos(angle) * spread,
          vy: vy * 0.15 + Math.sin(angle) * spread - 0.15, // slight lift, like antigravity
          size,
          life: 1,
          decay: 0.008 + Math.random() * 0.012,
          hue: 210 + Math.random() * 80, // blue → violet
        });
        if (particles.length > MAX) particles.splice(0, particles.length - MAX);
      }

      function move(x, y) {
        if (lastX === -999) { lastX = x; lastY = y; mouseX = x; mouseY = y; return; }
        const dx = x - lastX;
        const dy = y - lastY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 1) return;

        mouseX = x; mouseY = y;

        // more particles when moving faster; interpolate along the stroke
        const steps = Math.min(8, Math.ceil(dist / 6));
        const speedFactor = Math.min(6, dist / 4);
        const count = Math.max(1, Math.round(speedFactor));
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const px = lastX + dx * t;
          const py = lastY + dy * t;
          for (let k = 0; k < count; k++) spawn(px, py, dx, dy);
        }
        lastX = x;
        lastY = y;
      }

      window.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length) move(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener('mouseenter', () => { lastX = -999; });

      function render() {
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];

          // antigravity-ish physics: slow drift with slight upward pull and gentle attraction to cursor
          p.vy -= 0.01;             // rises subtly
          p.vx *= 0.985;
          p.vy *= 0.985;
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;

          if (p.life <= 0) { particles.splice(i, 1); continue; }

          const a = Math.max(0, Math.min(1, p.life));
          // soft glow
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4);
          g.addColorStop(0, `hsla(${p.hue}, 95%, 82%, ${a})`);
          g.addColorStop(0.6, `hsla(${p.hue}, 95%, 70%, ${a * 0.35})`);
          g.addColorStop(1, `hsla(${p.hue}, 95%, 60%, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 4, 0, Math.PI * 2);
          ctx.fill();

          // crisp core
          ctx.fillStyle = `rgba(255, 255, 255, ${a * 0.9})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>

  <!-- Codex-style soft cursor glow -->
  <script>
    (function () {
      const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (!finePointer.matches || reducedMotion.matches) return;

      const canvas = document.getElementById('ripples');
      const ctx = canvas.getContext('2d');
      let width = 0;
      let height = 0;
      let dpr = 1;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      resize();
      window.addEventListener('resize', resize, { passive: true });

      const target = { x: width / 2, y: height / 2 };
      const glow = { x: target.x, y: target.y };
      const tail = { x: target.x, y: target.y };
      let visibility = 0;
      let desiredVisibility = 0;
      let lastFrame = performance.now();

      window.addEventListener('pointermove', (event) => {
        target.x = event.clientX;
        target.y = event.clientY;
        desiredVisibility = 1;
      }, { passive: true });
      document.documentElement.addEventListener('mouseenter', () => { desiredVisibility = 1; });
      document.documentElement.addEventListener('mouseleave', () => { desiredVisibility = 0; });
      window.addEventListener('blur', () => { desiredVisibility = 0; });

      function paintGlow(x, y, radius, color, alpha) {
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, `rgba(${color}, ${alpha})`);
        gradient.addColorStop(.2, `rgba(${color}, ${alpha * .72})`);
        gradient.addColorStop(.55, `rgba(${color}, ${alpha * .25})`);
        gradient.addColorStop(1, `rgba(${color}, 0)`);
        ctx.fillStyle = gradient;
        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      }

      function render(now) {
        const delta = Math.min(32, now - lastFrame);
        lastFrame = now;
        const follow = 1 - Math.pow(.80, delta / 16.67);
        const drift = 1 - Math.pow(.90, delta / 16.67);
        const fade = 1 - Math.pow(.84, delta / 16.67);

        glow.x += (target.x - glow.x) * follow;
        glow.y += (target.y - glow.y) * follow;
        tail.x += (glow.x - tail.x) * drift;
        tail.y += (glow.y - tail.y) * drift;
        visibility += (desiredVisibility - visibility) * fade;

        ctx.clearRect(0, 0, width, height);
        if (visibility > .003) {
          ctx.globalCompositeOperation = 'screen';
          paintGlow(tail.x - 18, tail.y + 12, 145, '111, 154, 255', .075 * visibility);
          paintGlow(glow.x + 14, glow.y - 8, 105, '222, 177, 255', .105 * visibility);
          paintGlow(glow.x, glow.y, 54, '211, 232, 255', .16 * visibility);
          ctx.globalCompositeOperation = 'source-over';
        }
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
